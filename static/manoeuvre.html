<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
/*__BASE_CSS__*/
.sim { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(250px, 1fr); gap: 14px; padding: 4px; }
@media (max-width: 820px) { .sim { grid-template-columns: 1fr; } }
.stage { align-self: start; background: #fff; border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; position: relative; }
.stage svg { display: block; width: 100%; height: auto; }
.caption {
  position: absolute; left: 14px; top: 12px; right: 14px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; pointer-events: none;
}
.now {
  background: rgba(26,35,50,.82); color: #fff; border-radius: 14px; padding: 8px 12px; max-width: 70%;
  backdrop-filter: blur(6px); box-shadow: 0 8px 20px rgba(0,0,0,.18); transition: opacity .25s ease;
}
.now b { display: block; font-size: 14px; }
.now span { font-size: 12.5px; color: #D7E3EA; line-height: 1.4; }
.hud { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
.chip { font-size: 11.5px; font-weight: 700; padding: 4px 9px; border-radius: 999px; background: rgba(255,255,255,.92); color: var(--ink); box-shadow: 0 4px 12px rgba(0,0,0,.12); transition: background .3s ease, color .3s ease; white-space: nowrap; }
.chip.warn { background: #FFE6D6; color: #9A3412; }
.chip.ok { background: #DDF5EA; color: #0B6E4F; }
.chip.rev { background: #FFF3D6; color: #9A6A12; }
.progress { height: 5px; background: #ECE8E1; }
.progress i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--green), var(--navy)); transition: width .1s linear; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 12px; align-items: center; border-top: 1px solid var(--line); }
.controls .spacer { flex: 1; }
.controls select { border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; font-family: inherit; font-weight: 600; font-size: 13px; background: #fff; }
.steps { background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 14px; box-shadow: var(--shadow); max-height: 520px; overflow: auto; }
.steps h3 { margin: 2px 0 10px; font-size: 15px; }
.step {
  display: grid; grid-template-columns: 28px 1fr; gap: 10px; padding: 9px 10px; border-radius: 12px; cursor: pointer; border: 1px solid transparent;
  transition: background .2s ease, border-color .2s ease, transform .2s ease;
}
.step:hover { background: #F6F4F0; }
.step .n { width: 26px; height: 26px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; background: #EEF2F6; color: var(--navy); transition: all .25s ease; }
.step b { font-size: 13px; display: block; }
.step span { font-size: 12px; color: var(--muted); line-height: 1.4; }
.step.done .n { background: var(--green-soft); color: var(--green); }
.step.active { background: #F2FBF7; border-color: #9AD9BF; transform: translateX(3px); }
.step.active .n { background: linear-gradient(135deg, var(--green), var(--teal)); color: #fff; }
.tag-r { font-size: 10px; font-weight: 800; color: #9A6A12; background: #FFF3D6; border-radius: 999px; padding: 1px 6px; margin-left: 4px; }
.legend { display: flex; gap: 14px; font-size: 11.5px; color: var(--muted); margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line); }
.legend i { display: inline-block; width: 18px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
.blink { animation: blink .8s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
<div class="sim">
  <div class="stage">
    <svg id="svg" viewBox="0 0 640 360" role="img" aria-label="Manoeuvre animation">
      <g id="bg"></g>
      <g id="ghosts"></g>
      <g id="trail" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></g>
      <g id="markers"></g>
      <g id="car"></g>
    </svg>
    <div class="caption">
      <div class="now" id="now"><b></b><span></span></div>
      <div class="hud" id="hud"></div>
    </div>
    <div class="progress"><i id="prog"></i></div>
    <div class="controls">
      <button class="btn primary" id="play">▶ Play</button>
      <button class="btn" id="prev" title="Previous step">◀ Step</button>
      <button class="btn" id="next" title="Next step">Step ▶</button>
      <button class="btn" id="restart" title="Restart">↺ Restart</button>
      <span class="spacer"></span>
      <label style="font-size:12px;color:var(--muted);font-weight:600">Speed
        <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.6">1.6×</option></select>
      </label>
    </div>
  </div>
  <div class="steps">
    <h3 id="stitle"></h3>
    <div id="slist"></div>
    <div class="legend"><span><i style="background:#12A67A"></i>Forward</span><span><i style="background:#E0A030"></i>Reverse</span><span><i style="background:#9AA3AB;height:8px;width:8px;border-radius:50%"></i>Stop</span></div>
  </div>
</div>

<script>
const DATA = __DATA__;
const NS = "http://www.w3.org/2000/svg";
const $ = id => document.getElementById(id);

/* ------------------------------------------------------------------ */
/* Scenes. Car geometry: centred on (x, y), heading in degrees,        */
/* 0 = pointing right, 90 = pointing down (SVG y grows downwards).     */
/* Moves are cubic Béziers [P0, C1, C2, P3].                            */
/* ------------------------------------------------------------------ */
const GRASS = `<rect width="640" height="360" fill="#DCEBD5"/>
  <g fill="#C9DFC0">${Array.from({length: 40}, (_, i) => `<circle cx="${(i * 97) % 640}" cy="${(i * 53) % 360}" r="${3 + (i % 4)}"/>`).join("")}</g>`;

const SCENES = {
  "Turn in the road (turnabout)": {
    style: "top",
    bg: `${GRASS}
      <rect x="0" y="95" width="640" height="175" fill="#4A535E"/>
      <rect x="0" y="89" width="640" height="6" fill="#B9B2A6"/><rect x="0" y="270" width="640" height="6" fill="#B9B2A6"/>
      <line x1="0" y1="182" x2="640" y2="182" stroke="#F4F1EA" stroke-width="3" stroke-dasharray="22 18" opacity=".8"/>
      <text x="620" y="84" text-anchor="end" font-size="11" font-weight="700" fill="#5C6770">Kerb</text>
      <text x="620" y="292" text-anchor="end" font-size="11" font-weight="700" fill="#5C6770">Kerb</text>`,
    markers: [[140, 130, "1"], [320, 235, "2"], [355, 132, "3"], [170, 225, "4"]],
    segments: [
      { at: [140, 130], h: 0, label: "Position 1 · Prepare and observe", detail: "P.O.M. Check your mirrors and look all round, including the blind spot over your right shoulder.", dur: 2000, ghost: true, hud: ["Handbrake on", "1st gear"] },
      { p: [[140, 130], [230, 130], [320, 170], [320, 235]], label: "Move off on full right lock", detail: "Creep forward very slowly and steer briskly to full right lock.", dur: 2800, hud: ["1st gear", "Crawl speed"] },
      { at: [320, 235], label: "Position 2 · Stop before the kerb", detail: "Steer briskly left near the kerb, clutch down and brake. Secure the car and look through the rear window.", dur: 1900, ghost: true, hud: ["Handbrake on", "Look behind"] },
      { p: [[320, 235], [320, 180], [330, 140], [355, 132]], reverse: true, label: "Reverse across the road", detail: "Release the handbrake, steer briskly left. Look over your left shoulder, then steer right halfway across.", dur: 2900, hud: ["Reverse", "Look over shoulder"] },
      { at: [355, 132], label: "Position 3 · Stop before the kerb", detail: "Check your reference point, clutch down, brake and secure the car. Look all round again.", dur: 1800, ghost: true, hud: ["Handbrake on"] },
      { p: [[355, 132], [300, 152], [250, 225], [170, 225]], label: "Steer right and drive on", detail: "Steer briskly right and check your clearance from the kerb.", dur: 2800, hud: ["1st gear"] },
      { at: [170, 225], label: "Position 4 · Drive on", detail: "Check mirrors, then drive on or pull in using mirror, signal, manoeuvre.", dur: 1600, ghost: true, hud: ["Done in 3 moves"] },
    ],
  },
  "Reverse around a corner": {
    style: "top",
    bg: `${GRASS}
      <rect x="380" y="0" width="140" height="360" fill="#4A535E"/>
      <rect x="0" y="170" width="380" height="120" fill="#4A535E"/>
      <path d="M380 140 L380 170 L350 170 A30 30 0 0 0 380 140 Z" fill="#4A535E"/>
      <path d="M380 290 L380 320 A30 30 0 0 0 350 290 Z" fill="#4A535E"/>
      <g fill="none" stroke="#B9B2A6" stroke-width="6">
        <path d="M380 0 L380 140 A30 30 0 0 1 350 170 L0 170"/>
        <path d="M0 290 L350 290 A30 30 0 0 1 380 320 L380 360"/>
        <path d="M520 0 L520 360"/>
      </g>
      <line x1="450" y1="0" x2="450" y2="360" stroke="#F4F1EA" stroke-width="3" stroke-dasharray="22 18" opacity=".8"/>
      <line x1="0" y1="230" x2="372" y2="230" stroke="#F4F1EA" stroke-width="3" stroke-dasharray="22 18" opacity=".8"/>
      <text x="20" y="160" font-size="11" font-weight="700" fill="#5C6770">Side road</text>
      <text x="530" y="350" font-size="11" font-weight="700" fill="#5C6770">Main road</text>
      <line x1="345" y1="200" x2="170" y2="200" stroke="#fff" stroke-width="1.5" stroke-dasharray="4 6" opacity=".5"/>
      <text x="258" y="216" text-anchor="middle" font-size="10.5" font-weight="700" fill="#E9EEF2" opacity=".8">3–4 car lengths</text>`,
    markers: [[410, 95, "S"], [410, 150, "T"]],
    segments: [
      { at: [410, 330], h: -90, signal: "left", label: "Approach with M.S.M.", detail: "Check mirrors, signal left and look into the side road as you pass it.", dur: 1900, hud: ["Signal left", "Look into side road"] },
      { p: [[410, 330], [410, 250], [410, 170], [410, 95]], signal: "left", label: "Drive past the junction", detail: "Keep about a drain's width from the kerb.", dur: 2500, hud: ["2nd gear"] },
      { at: [410, 95], label: "Stop and prepare", detail: "Stop parallel to the kerb. P.O.M., then look over your left shoulder through the rear window.", dur: 1900, ghost: true, hud: ["Handbrake on", "Look all round"] },
      { p: [[410, 95], [410, 115], [410, 135], [410, 150]], reverse: true, label: "Reverse straight", detail: "Keep the steering straight until your reference point reaches the start of the bend (T).", dur: 2000, hud: ["Reverse", "Crawl speed"] },
      { p: [[410, 150], [410, 195], [400, 200], [345, 200]], reverse: true, label: "Steer around the corner", detail: "Steer left to follow the kerb. The front swings out, so check over your right shoulder.", dur: 3000, hud: ["Reverse", "Check right shoulder"], warnAt: 0.3 },
      { p: [[345, 200], [290, 200], [230, 200], [170, 200]], reverse: true, label: "Straighten up and continue", detail: "Stay close and parallel to the kerb for three to four car lengths.", dur: 2600, hud: ["Reverse", "Glance nearside mirror"] },
      { at: [170, 200], label: "Finish", detail: "Secure the car. Pull forward to correct if needed, but never touch the kerb.", dur: 1600, ghost: true, hud: ["Handbrake on"] },
    ],
  },
  "Hill start": {
    style: "side",
    bg: `<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CFE8F5"/><stop offset="1" stop-color="#F3F7F2"/></linearGradient></defs>
      <rect width="640" height="360" fill="url(#sky)"/>
      <circle cx="560" cy="60" r="26" fill="#FFE29A" opacity=".9"/>
      <path d="M0 360 L0 250 Q120 230 200 260 T420 220 T640 200 L640 360 Z" fill="#CFE3C4" opacity=".7"/>
      <path d="M0 360 L0 334 L40 320 L600 150 L640 140 L640 360 Z" fill="#A9CF98"/>
      <path d="M0 334 L40 320 L600 150 L640 140" fill="none" stroke="#4A535E" stroke-width="14" stroke-linejoin="round"/>
      <path d="M0 334 L40 320 L600 150 L640 140" fill="none" stroke="#F4F1EA" stroke-width="2" stroke-dasharray="16 14" transform="translate(0,-1)"/>
      <g transform="translate(520,120)"><rect x="-2" y="0" width="4" height="46" fill="#5C6770"/><path d="M0 -26 L22 10 L-22 10 Z" fill="#FFF" stroke="#D64545" stroke-width="4" stroke-linejoin="round"/><text x="0" y="6" text-anchor="middle" font-size="12" font-weight="800" fill="#1A2332">%</text></g>
      <g fill="#6FA35E"><circle cx="90" cy="280" r="16"/><circle cx="250" cy="236" r="20"/><circle cx="470" cy="186" r="14"/></g>`,
    markers: [],
    segments: [
      { at: [135.4, 274.3], h: -16.9, label: "Prepare", detail: "Clutch down, select first gear and set a little more gas than on the flat. Raise the clutch to the biting point and hold it.", dur: 2600, hud: ["Handbrake on", "Clutch: biting point", "Gas set"] },
      { at: [135.4, 274.3], h: -16.9, signal: "right", label: "Observe", detail: "Check your mirrors and look over your right shoulder for the blind spot. Signal if it would help another road user.", dur: 2400, hud: ["Handbrake on", "Mirrors + blind spot"] },
      { at: [135.4, 274.3], h: -16.9, label: "Release the handbrake", detail: "The car should hold or creep forward. If it starts to roll back, put the handbrake back on and start again.", dur: 1900, hud: ["Handbrake off", "No roll-back"], ok: true },
      { p: [[135.4, 274.3], [230, 245], [320, 218], [415.4, 189.3]], label: "Move off smoothly", detail: "Raise the clutch slowly and add gas as you pull away. Don't over-rev or ride the clutch.", dur: 3200, hud: ["1st gear", "Smooth gas"] },
      { at: [415.4, 189.3], h: -16.9, label: "Up and away", detail: "No roll-back, no stall, no over-revving. That's a clean hill start.", dur: 1500, hud: ["Clean start"], ok: true },
    ],
  },
};

/* ------------------------------------------------------------------ */
const scene = SCENES[DATA.name] || Object.values(SCENES)[0];
const segs = scene.segments;
$("bg").innerHTML = scene.bg;
$("stitle").textContent = DATA.name;

const bez = (p, t) => {
  const u = 1 - t;
  return [0, 1].map(k => u*u*u*p[0][k] + 3*u*u*t*p[1][k] + 3*u*t*t*p[2][k] + t*t*t*p[3][k]);
};
const dbez = (p, t) => {
  const u = 1 - t;
  return [0, 1].map(k => 3*u*u*(p[1][k]-p[0][k]) + 6*u*t*(p[2][k]-p[1][k]) + 3*t*t*(p[3][k]-p[2][k]));
};
const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;

/* Resolve every segment's start/end pose so steps can be jumped to. */
let heading = 0;
segs.forEach(s => {
  if (s.p) {
    s.start = { x: s.p[0][0], y: s.p[0][1] };
    s.samples = [];
    for (let i = 0; i <= 60; i++) s.samples.push(bez(s.p, i / 60));
  } else {
    if (s.h !== undefined) heading = s.h;
    s.pose = { x: s.at[0], y: s.at[1], h: heading };
  }
  s.poseAt = t => {
    if (!s.p) return s.pose;
    const [x, y] = bez(s.p, t);
    const [dx, dy] = dbez(s.p, Math.min(.999, Math.max(.001, t)));
    let h = Math.atan2(dy, dx) * 180 / Math.PI;
    if (s.reverse) h += 180;
    return { x, y, h };
  };
  if (s.p) heading = s.poseAt(1).h;
});

/* Car drawings, pointing +x. */
function carSVG(style) {
  if (style === "side") {
    return `<g transform="translate(-34,-24)">
      <path d="M2 30 Q2 21 12 19 L26 17 Q34 6 48 6 L56 6 Q66 7 72 17 L80 19 Q86 21 86 28 L86 32 L2 32 Z" fill="#0B6E4F"/>
      <path d="M30 17 Q36 9 46 9 L50 9 L50 17 Z" fill="#BFE3F2"/><path d="M53 9 L56 9 Q63 10 68 17 L53 17 Z" fill="#BFE3F2"/>
      <rect x="78" y="21" width="7" height="4" rx="2" fill="#FFE9A8"/>
      <rect id="brake" x="2" y="21" width="5" height="4" rx="1.5" fill="#B33"/>
      <rect id="indR" x="80" y="26" width="5" height="3" rx="1" fill="#FFB020" opacity="0"/>
      <rect x="12" y="10" width="11" height="8" rx="1.5" fill="#fff" stroke="#D64545"/><text x="17.5" y="16.5" text-anchor="middle" font-size="6.5" font-weight="800" fill="#D64545">L</text>
      <g class="wheel"><circle cx="22" cy="33" r="8" fill="#1A2028"/><circle cx="22" cy="33" r="3.5" fill="#9AA3AB"/></g>
      <g class="wheel"><circle cx="68" cy="33" r="8" fill="#1A2028"/><circle cx="68" cy="33" r="3.5" fill="#9AA3AB"/></g>
    </g>`;
  }
  return `<g>
    <rect x="-29" y="-15" width="58" height="30" rx="8" fill="#0B6E4F" stroke="#08513A" stroke-width="1.5"/>
    <path d="M7 -12 L16 -10 L16 10 L7 12 Z" fill="#BFE3F2"/>
    <path d="M-18 -11 L-12 -12 L-12 12 L-18 11 Z" fill="#BFE3F2"/>
    <rect x="-9" y="-11" width="14" height="22" rx="3" fill="#12A67A" opacity=".55"/>
    <rect x="25" y="-12" width="4" height="6" rx="1.5" fill="#FFE9A8"/><rect x="25" y="6" width="4" height="6" rx="1.5" fill="#FFE9A8"/>
    <rect id="brake" x="-29" y="-12" width="3" height="24" rx="1.5" fill="#B33"/>
    <rect id="revL" x="-31" y="-6" width="3" height="12" rx="1.5" fill="#FFFFFF" opacity="0"/>
    <g id="indL" opacity="0"><circle cx="26" cy="-15" r="3.2" fill="#FFB020"/><circle cx="-26" cy="-15" r="3.2" fill="#FFB020"/></g>
    <g id="indR" opacity="0"><circle cx="26" cy="15" r="3.2" fill="#FFB020"/><circle cx="-26" cy="15" r="3.2" fill="#FFB020"/></g>
    <rect x="-6" y="-6" width="12" height="12" rx="2" fill="#fff" stroke="#D64545" stroke-width="1"/><text x="0" y="3.5" text-anchor="middle" font-size="9" font-weight="800" fill="#D64545">L</text>
  </g>`;
}
const car = $("car");
car.innerHTML = carSVG(scene.style);
car.style.filter = "drop-shadow(0 3px 4px rgba(0,0,0,.35))";

/* Position markers and ghost cars at each stop. */
$("markers").innerHTML = scene.markers.map(([x, y, n]) =>
  `<g transform="translate(${x},${y})" opacity=".95"><circle r="11" fill="#fff" stroke="#1F4E79" stroke-width="2"/><text y="4" text-anchor="middle" font-size="11" font-weight="800" fill="#1F4E79">${n}</text></g>`).join("");
$("ghosts").innerHTML = segs.filter(s => s.ghost && scene.style === "top").map(s =>
  `<g transform="translate(${s.pose.x},${s.pose.y}) rotate(${s.pose.h})"><rect x="-29" y="-15" width="58" height="30" rx="8" fill="none" stroke="#fff" stroke-width="1.5" stroke-dasharray="4 4" opacity=".55"/></g>`).join("");

/* Step list */
const slist = $("slist");
const stepEls = segs.map((s, i) => {
  const el = document.createElement("div");
  el.className = "step";
  el.innerHTML = `<div class="n">${i + 1}</div><div><b></b><span></span></div>`;
  el.querySelector("b").textContent = s.label;
  if (s.reverse) el.querySelector("b").insertAdjacentHTML("beforeend", '<span class="tag-r">R</span>');
  el.querySelector("div:last-child > span").textContent = s.detail;
  el.addEventListener("click", () => { jump(i); setPlaying(false); });
  slist.append(el);
  return el;
});

/* ------------------------------------------------------------------ */
let idx = 0, elapsed = 0, playing = false, last = null, speed = 1, shownIdx = -1;
const totalDur = segs.reduce((a, s) => a + s.dur, 0);

function drawTrail() {
  if (scene.style === "side") return;  // side view: the car itself shows progress up the hill
  const parts = [];
  segs.forEach((s, i) => {
    if (!s.p || i > idx) return;
    const t = i < idx ? 1 : ease(Math.min(1, elapsed / s.dur));
    const n = Math.max(1, Math.round(t * 60));
    const pts = s.samples.slice(0, n + 1).map(p => p.join(",")).join(" ");
    parts.push(`<polyline points="${pts}" stroke="${s.reverse ? "#E0A030" : "#12A67A"}" ${s.reverse ? 'stroke-dasharray="7 6"' : ""} opacity=".9"/>`);
  });
  $("trail").innerHTML = parts.join("");
}

function render() {
  const s = segs[idx];
  const t = s.p ? ease(Math.min(1, elapsed / s.dur)) : 0;
  const pose = s.poseAt(t);
  car.setAttribute("transform", `translate(${pose.x.toFixed(2)},${pose.y.toFixed(2)}) rotate(${pose.h.toFixed(2)})`);

  const moving = !!s.p && t < 1;
  car.querySelectorAll(".wheel").forEach(w => {
    w.style.transformBox = "fill-box"; w.style.transformOrigin = "center";
    w.style.transform = `rotate(${(s.p ? t * 540 * (s.reverse ? -1 : 1) : 0)}deg)`;
  });
  const brake = car.querySelector("#brake");
  if (brake) brake.setAttribute("fill", moving ? "#B33" : "#FF4D4D");
  const rev = car.querySelector("#revL");
  if (rev) rev.setAttribute("opacity", s.reverse ? "1" : "0");
  const blinkOn = Math.floor(performance.now() / 380) % 2 === 0;
  const il = car.querySelector("#indL"), ir = car.querySelector("#indR");
  if (il) il.setAttribute("opacity", s.signal === "left" && blinkOn ? "1" : "0");
  if (ir) ir.setAttribute("opacity", s.signal === "right" && blinkOn ? "1" : "0");

  drawTrail();
  const before = segs.slice(0, idx).reduce((a, x) => a + x.dur, 0);
  $("prog").style.width = (100 * (before + Math.min(elapsed, s.dur)) / totalDur) + "%";
  if (idx === shownIdx) return;
  shownIdx = idx;
  const now = $("now");
  now.querySelector("b").textContent = `${idx + 1}. ${s.label}`;
  now.querySelector("span").textContent = s.detail;
  $("hud").innerHTML = (s.hud || []).map(h => {
    const cls = /off|clean|done/i.test(h) ? "ok" : /reverse/i.test(h) ? "rev" : /check|look|mirror|signal/i.test(h) ? "warn" : "";
    return `<span class="chip ${cls}">${h}</span>`;
  }).join("");
  stepEls.forEach((el, i) => { el.classList.toggle("active", i === idx); el.classList.toggle("done", i < idx); });
}

function jump(i) {
  idx = Math.max(0, Math.min(segs.length - 1, i));
  elapsed = 0;
  render();
  stepEls[idx].scrollIntoView({ block: "nearest", behavior: "smooth" });
}

function frame(ts) {
  if (last === null) last = ts;
  const dt = Math.min(64, ts - last) * speed;
  last = ts;
  if (playing) {
    elapsed += dt;
    if (elapsed >= segs[idx].dur) {
      if (idx < segs.length - 1) { idx += 1; elapsed = 0; stepEls[idx].scrollIntoView({ block: "nearest", behavior: "smooth" }); }
      else { elapsed = segs[idx].dur; setPlaying(false); }
    }
  }
  render();
  requestAnimationFrame(frame);
}

function setPlaying(p) {
  playing = p;
  $("play").textContent = p ? "❚❚ Pause" : (idx === segs.length - 1 && elapsed >= segs[idx].dur ? "↺ Replay" : "▶ Play");
}
$("play").addEventListener("click", () => {
  if (!playing && idx === segs.length - 1 && elapsed >= segs[idx].dur) jump(0);
  setPlaying(!playing);
});
$("next").addEventListener("click", () => { setPlaying(false); jump(idx + 1); });
$("prev").addEventListener("click", () => { setPlaying(false); jump(idx - 1); });
$("restart").addEventListener("click", () => { jump(0); setPlaying(true); });
$("speed").addEventListener("change", e => { speed = parseFloat(e.target.value); });

jump(0);
const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
setPlaying(!reduce);
requestAnimationFrame(frame);
</script>
</body>
</html>
